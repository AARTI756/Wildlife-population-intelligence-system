
services:
  postgres:
    image: postgres:15-alpine
    container_name: wpis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aarti
      POSTGRES_DB: wildlife_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wildlife_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpis-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=wildlife_db
      - DB_USER=postgres
      - DB_PASSWORD=Aarti
      - SECRET_KEY=9a7c64bb939d88040d12574e4c274b534d0b04a8b7c6de4259b39864ab1a2e31
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GOOGLE_CLIENT_ID=251145097240-g3h8t0l6ii219nhkv99mvgju6qo9c3ug.apps.googleusercontent.com
      - GEMINI_API_KEY=AIzaSyClHMW5t6hmLa1zN5k20Uzk-puTXmaoIB4
      - GEMINI_MODEL=gemini-1.5-flash
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wpis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
